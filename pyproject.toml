[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "marge"
version = "0.1.0"
description = "Risk-based (stress-test) portfolio margin calculator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
marge = "marge.cli:main"

[tool.setuptools]
packages = ["marge"]
